name: Require Release Label for Main

# Passive-doc boundary: identical allowlist to ci.yml. A docs-only PR to main
# never runs this label gate. See .github/DOCS_ONLY_CI.md for the full
# contract and the required-status-check caveat this creates.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    paths-ignore:
      - 'README.md'
      - 'garden-advisor-ui/README.md'

jobs:
  check-release-label:
    name: Check for release label
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check for 'release' label
        uses: actions/github-script@v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            console.log('PR labels:', labels);
            if (!labels.includes('release')) {
              core.setFailed(
                'PRs to main must be labeled "release" to indicate a new API version. ' +
                'Please add the "release" label to this pull request.'
              );
            } else {
              console.log('Release label found. Check passed.');
            }
