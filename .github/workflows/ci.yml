name: CI - Build and Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - id: filter
        name: Classify changed files
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          api=false
          ui=false
          while IFS= read -r path; do
            case "$path" in
              GardenAdvisor.API/*|GardenAdvisor.API.sln|GardenAdvisor.sln|Directory.Build.props|Directory.Packages.props|global.json)
                api=true
                ;;
              garden-advisor-ui/*|package.json|package-lock.json)
                ui=true
                ;;
            esac
          done <<< "$CHANGED"

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: GardenAdvisor.API
        run: dotnet restore

      - name: Build
        working-directory: GardenAdvisor.API
        run: dotnet build --no-restore --configuration Release

  build-and-test-ui:
    name: Build and Test UI
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: garden-advisor-ui/package-lock.json

      - name: Install dependencies
        working-directory: garden-advisor-ui
        run: npm ci

      - name: Build
        working-directory: garden-advisor-ui
        run: npm run build

      - name: Run tests
        working-directory: garden-advisor-ui
        run: npm test -- --watchAll=false --passWithNoTests
