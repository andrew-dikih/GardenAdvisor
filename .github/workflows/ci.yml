name: CI - Build and Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        name: Classify changed files
        run: |
          CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          echo "Changed files:"
          echo "$CHANGED"

          api=false
          ui=false
          while IFS= read -r path; do
            case "$path" in
              GardenAdvisor.API/*|GardenAdvisor.API.sln|GardenAdvisor.sln|Directory.Build.props|Directory.Packages.props|global.json)
                api=true
                ;;
              garden-advisor-ui/*|package.json|package-lock.json)
                ui=true
                ;;
            esac
          done <<< "$CHANGED"

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and Test
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip backend build when no API files changed
        if: needs.detect-changes.outputs.api != 'true'
        run: echo "No API changes detected; skipping backend build."

      - name: Setup .NET
        if: needs.detect-changes.outputs.api == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        if: needs.detect-changes.outputs.api == 'true'
        working-directory: GardenAdvisor.API
        run: dotnet restore

      - name: Build
        if: needs.detect-changes.outputs.api == 'true'
        working-directory: GardenAdvisor.API
        run: dotnet build --no-restore --configuration Release

  frontend-build:
    name: Frontend Build
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip frontend build when no UI files changed
        if: needs.detect-changes.outputs.ui != 'true'
        run: echo "No UI changes detected; skipping frontend build/test."

      - name: Setup Node.js
        if: needs.detect-changes.outputs.ui == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: garden-advisor-ui/package-lock.json

      - name: Install dependencies
        if: needs.detect-changes.outputs.ui == 'true'
        working-directory: garden-advisor-ui
        run: npm ci

      - name: Build
        if: needs.detect-changes.outputs.ui == 'true'
        working-directory: garden-advisor-ui
        run: npm run build

      - name: Run tests
        if: needs.detect-changes.outputs.ui == 'true'
        working-directory: garden-advisor-ui
        run: npm test -- --watchAll=false --passWithNoTests
