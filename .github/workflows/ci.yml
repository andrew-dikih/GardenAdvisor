name: CI - Build and Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore GardenAdvisor.API/GardenAdvisor.API.csproj

      - name: Build API
        run: dotnet build GardenAdvisor.API/GardenAdvisor.API.csproj --no-restore --configuration Release

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: garden-advisor-ui/package-lock.json

      - name: Install dependencies
        working-directory: garden-advisor-ui
        run: npm ci

      - name: Build frontend
        working-directory: garden-advisor-ui
        run: npm run build
