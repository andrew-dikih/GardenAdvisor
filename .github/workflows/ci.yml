name: CI - Build and Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  build-and-test-ui:
    name: Build and Test UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: garden-advisor-ui/package-lock.json

      - name: Install dependencies
        working-directory: garden-advisor-ui
        run: npm ci

      - name: Build
        working-directory: garden-advisor-ui
        run: npm run build

      - name: Run tests
        working-directory: garden-advisor-ui
        run: npm test -- --watchAll=false --passWithNoTests
