name: CD - Deploy to Azure

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ${{ vars.AZURE_REGISTRY_URL }}
  API_IMAGE: ${{ vars.AZURE_REGISTRY_URL }}/gardenadvisor-api
  WEB_IMAGE: ${{ vars.AZURE_REGISTRY_URL }}/gardenadvisor-web

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: GardenAdvisor.API/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }},${{ env.API_IMAGE }}:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: garden-advisor-ui
          file: garden-advisor-ui/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }},${{ env.WEB_IMAGE }}:latest

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions: {}
    environment:
      name: develop
      url: ${{ vars.AZURE_WEB_APP_URL }}
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API Container App
        env:
          CORS_ALLOWED_ORIGINS: ${{ vars.AZURE_WEB_APP_URL }}
        run: |
          az containerapp registry set \
            --name ${{ vars.AZURE_API_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --server ${{ vars.AZURE_REGISTRY_URL }} \
            --username ${{ vars.AZURE_REGISTRY_USERNAME }} \
            --password "${{ secrets.AZURE_REGISTRY_PASSWORD }}"

          az containerapp update \
            --name ${{ vars.AZURE_API_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.API_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }} \
            --set-env-vars \
              ASPNETCORE_URLS=http://+:5000 \
              Cors__AllowedOrigins__0="$CORS_ALLOWED_ORIGINS"

      - name: Deploy Web Container App
        run: |
          az containerapp registry set \
            --name ${{ vars.AZURE_WEB_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --server ${{ vars.AZURE_REGISTRY_URL }} \
            --username ${{ vars.AZURE_REGISTRY_USERNAME }} \
            --password "${{ secrets.AZURE_REGISTRY_PASSWORD }}"

          az containerapp update \
            --name ${{ vars.AZURE_WEB_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.WEB_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }} \
            --set-env-vars \
              REACT_APP_API_URL=${{ vars.AZURE_API_APP_URL }}

      - name: Verify deployment
        run: |
          echo "Deployment complete."
          echo "API: ${{ vars.AZURE_API_APP_URL }}"
          echo "Web: ${{ vars.AZURE_WEB_APP_URL }}"
